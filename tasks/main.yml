---

- name: Remove the legacy Docker repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  register: docker_legacy_repository

- name: Install Docker repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-debian
      - software-properties-common
    state: present
    cache_valid_time: 86400

- name: Configure the Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
  register: docker_repository

- name: Refresh the APT cache after Docker repository changes
  ansible.builtin.apt:
    update_cache: true
  when: docker_legacy_repository is changed or docker_repository is changed

- name: ensure docker package is installed
  apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin

