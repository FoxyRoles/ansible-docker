---

- name: apt cache updated
  apt:
    update_cache: True
    cache_valid_time: 86400

- name: ensure basic packages are installed
  apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
     - apt-transport-https
     - ca-certificates
     - curl
     - software-properties-common

- name: docker apt key present
  get_url:
    url:  https://download.docker.com/linux/ubuntu/gpg
    dest: /usr/share/keyrings/docker.asc

- name: docker apt list present
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
    update_cache: true

- name: ensure docker package is installed
  apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin

